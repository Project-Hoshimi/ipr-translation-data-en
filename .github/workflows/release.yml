name: release

on:
  push:
    branches:
      - main
  # Manual run: skips the release (already exists) and only re-sends the module-repo notify.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: echo "ver=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          zip -r "ipr-translation-data-en-${{ steps.ver.outputs.ver }}.zip" version.txt local-files

      - name: Check existing release (idempotency guard)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release tag ${{ steps.ver.outputs.ver }} already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Automatic Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.ver.outputs.ver }}"
          gh release create "$ver" \
            --title "Release $ver" \
            --notes "English translation data" \
            --generate-notes \
            --latest
          gh release upload "$ver" "ipr-translation-data-en-$ver.zip" --clobber

      # continue-on-error so a token problem never fails the data release.
      - name: Notify module repo (Project-Hoshimi)
        if: steps.guard.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: |
          gh api repos/Project-Hoshimi/HoshimiLocalify-en/dispatches \
            -X POST \
            -f event_type=data-release \
            -f "client_payload[tag]=${{ steps.ver.outputs.ver }}"
